# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  build:
    runs-on: ubuntu-latest
    env:
      DOCAPELLA_REPO: https://github.com/gael-o0o/docapella.git
      DOCAPELLA_BRANCH: fix/auth_tab_missing
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      - name: Resolve docapella revision
        id: docapella-rev
        # pins the exact commit so the cache key only changes when upstream actually moves
        run: echo "sha=$(git ls-remote "$DOCAPELLA_REPO" "refs/heads/$DOCAPELLA_BRANCH" | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache docapella binary
        id: docapella-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/docapella
          key: docapella-${{ steps.docapella-rev.outputs.sha }}
      - name: Install docapella
        if: steps.docapella-cache.outputs.cache-hit != 'true'
        run: cargo install --git "$DOCAPELLA_REPO" --rev ${{ steps.docapella-rev.outputs.sha }} docapella
      - name: Exclude files not meant for the site
        # docapella has no ignore mechanism; it turns every *.md file into a page
        run: rm -f CLAUDE.md
      - name: Build docs
        run: docapella build
      - name: Generate sitemap.xml and robots.txt
        run: |
          domain=$(grep '^domain:' docapella.yaml | sed 's/^domain:[[:space:]]*//')

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find _build -name '*.html' ! -name '404.html' | sort | while read -r file; do
              path="${file#_build/}"
              path="${path%.html}"
              # strip a trailing "index" segment to match Doctave's extensionless URLs
              path="${path%index}"
              echo "  <url><loc>${domain}/${path}</loc></url>"
            done
            echo '</urlset>'
          } > _build/sitemap.xml

          printf 'User-agent: *\nAllow: /\nSitemap: %s/sitemap.xml\n' "$domain" > _build/robots.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '_build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
